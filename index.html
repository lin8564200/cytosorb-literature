<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CytoSorb 文獻資料庫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F5F0;
  --surface: #FFFFFF;
  --border: #E2DDD6;
  --border-strong: #C8C0B4;
  --text: #1A1714;
  --text-2: #5C554D;
  --text-3: #9C9288;
  --accent: #1A5FA8;
  --accent-light: #E8F1FB;
  --green: #0F6E56;
  --green-light: #E1F5EE;
  --amber: #854F0B;
  --amber-light: #FAEEDA;
  --red: #A32D2D;
  --red-light: #FADBD8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Noto Serif TC', serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* LOGIN */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
#login-screen::before {
  content: '';
  position: absolute;
  top: -200px; right: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(26,95,168,0.06) 0%, transparent 70%);
  pointer-events: none;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 3rem 2.5rem;
  width: 100%;
  max-width: 400px;
  text-align: center;
  position: relative;
}
.login-logo {
  width: 56px; height: 56px;
  background: var(--accent);
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1.5rem;
  font-size: 28px;
}
.login-title {
  font-family: 'Instrument Serif', serif;
  font-size: 26px;
  font-weight: 400;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.3px;
}
.login-sub {
  font-size: 13px;
  color: var(--text-3);
  margin-bottom: 2rem;
  font-family: 'DM Mono', monospace;
  font-weight: 400;
}
.login-input {
  width: 100%;
  padding: 12px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 15px;
  font-family: 'DM Mono', monospace;
  background: var(--bg);
  color: var(--text);
  letter-spacing: 2px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color 0.2s;
}
.login-input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%;
  padding: 12px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Noto Serif TC', serif;
  font-weight: 500;
  cursor: pointer;
  transition: opacity 0.2s;
  letter-spacing: 0.5px;
}
.login-btn:hover { opacity: 0.9; }
.login-error {
  margin-top: 10px;
  font-size: 12px;
  color: var(--red);
  font-family: 'DM Mono', monospace;
  display: none;
}

/* MAIN APP */
#app { display: none; }

/* TOPBAR */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 2rem;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-logo {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; color: #fff;
}
.topbar-title {
  font-family: 'Instrument Serif', serif;
  font-size: 18px;
  color: var(--text);
  letter-spacing: -0.2px;
}
.topbar-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--text-3);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 10px;
}
.logout-btn {
  font-size: 12px;
  color: var(--text-3);
  background: none;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  cursor: pointer;
  font-family: 'DM Mono', monospace;
  transition: all 0.15s;
}
.logout-btn:hover { border-color: var(--border-strong); color: var(--text-2); }

/* LAYOUT */
.layout { display: flex; min-height: calc(100vh - 60px); }

/* SIDEBAR */
.sidebar {
  width: 240px;
  flex-shrink: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 1.5rem 1rem;
  position: sticky;
  top: 60px;
  height: calc(100vh - 60px);
  overflow-y: auto;
}
.sidebar-section { margin-bottom: 1.5rem; }
.sidebar-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 8px;
  padding: 0 6px;
}
.filter-chip {
  display: flex; align-items: center; justify-content: space-between;
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.12s;
  border: none; background: none; width: 100%; text-align: left;
  font-family: 'Noto Serif TC', serif;
  margin-bottom: 2px;
}
.filter-chip:hover { background: var(--bg); color: var(--text); }
.filter-chip.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.chip-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  background: var(--bg);
  border-radius: 10px;
  padding: 1px 7px;
  color: var(--text-3);
}
.filter-chip.active .chip-count {
  background: rgba(26,95,168,0.12);
  color: var(--accent);
}

/* MAIN */
.main { flex: 1; padding: 1.5rem 2rem; min-width: 0; }

/* SEARCH + CONTROLS */
.controls { display: flex; gap: 10px; margin-bottom: 1.25rem; align-items: center; }
.search-wrap { flex: 1; position: relative; }
.search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); width: 16px; height: 16px; }
.search-input {
  width: 100%;
  padding: 10px 16px 10px 38px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: 'Noto Serif TC', serif;
  background: var(--surface);
  color: var(--text);
  outline: none;
  transition: border-color 0.2s;
}
.search-input:focus { border-color: var(--accent); }
.sort-select {
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  background: var(--surface);
  color: var(--text-2);
  cursor: pointer;
  outline: none;
  font-family: 'DM Mono', monospace;
}
.result-info {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text-3);
  margin-bottom: 1rem;
}
.result-info span { color: var(--text); font-weight: 500; }

/* CARDS */
.cards { display: flex; flex-direction: column; gap: 10px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.card:hover { border-color: var(--border-strong); box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
.card-header {
  padding: 1rem 1.25rem;
  cursor: pointer;
  display: flex; gap: 12px; align-items: flex-start;
}
.card-left { flex: 1; min-width: 0; }
.card-badges { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
.badge {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.3px;
  font-weight: 500;
}
.badge-ind { background: var(--accent-light); color: var(--accent); }
.badge-type { background: var(--bg); color: var(--text-2); border: 1px solid var(--border); }
.badge-ce { background: var(--green-light); color: var(--green); }
.badge-year { background: var(--bg); color: var(--text-3); border: 1px solid var(--border); }
.badge-rct { background: #EDE9FE; color: #5B21B6; }
.badge-meta { background: #FFF7ED; color: #C2410C; }
.stars { font-size: 12px; margin-left: 2px; }
.card-title {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 6px;
}
.card-snippet {
  font-size: 13px;
  color: var(--text-3);
  line-height: 1.6;
}
.card-chevron {
  color: var(--text-3);
  flex-shrink: 0;
  margin-top: 2px;
  transition: transform 0.2s;
}
.card.open .card-chevron { transform: rotate(180deg); }

/* CARD DETAIL */
.card-detail {
  border-top: 1px solid var(--border);
  padding: 1.25rem;
  display: none;
  background: var(--bg);
}
.card.open .card-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 1rem; }
.detail-item {}
.detail-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 4px;
}
.detail-val { font-size: 13px; color: var(--text); line-height: 1.5; }
.section-block { margin-bottom: 1rem; }
.section-title {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-3);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 6px;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}
.finding-text {
  font-size: 14px;
  color: var(--text);
  line-height: 1.8;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
}
.sales-block {
  background: var(--green-light);
  border: 1px solid rgba(15,110,86,0.2);
  border-radius: 8px;
  padding: 12px 14px;
}
.sales-label {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 5px;
}
.sales-text { font-size: 13px; color: #085041; line-height: 1.7; }
.card-link {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 1rem;
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--accent);
  text-decoration: none;
  padding: 7px 14px;
  border: 1px solid rgba(26,95,168,0.3);
  border-radius: 6px;
  transition: all 0.15s;
}
.card-link:hover { background: var(--accent-light); }

/* EMPTY */
.empty {
  text-align: center;
  padding: 4rem 2rem;
  color: var(--text-3);
  font-family: 'DM Mono', monospace;
  font-size: 13px;
}
.empty-icon { font-size: 32px; margin-bottom: 12px; display: block; }

/* LOADING */
.loading { text-align: center; padding: 4rem 2rem; }
.loading-text { font-family: 'DM Mono', monospace; font-size: 12px; color: var(--text-3); margin-top: 12px; }
.spinner {
  width: 28px; height: 28px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { padding: 1rem; }
  .topbar { padding: 0 1rem; }
  .detail-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧬</div>
    <h1 class="login-title">CytoSorb 文獻庫</h1>
    <p class="login-sub">英禾美生醫 · 臨床文獻資料庫</p>
    <input type="password" class="login-input" id="pw-input" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入文獻庫</button>
    <p class="login-error" id="login-error">密碼錯誤，請重試</p>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🧬</div>
      <span class="topbar-title">CytoSorb 文獻資料庫</span>
      <span class="topbar-count" id="total-badge">載入中...</span>
    </div>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">適應症</div>
        <button class="filter-chip active" onclick="setInd('')" id="ind-btn-all">
          全部 <span class="chip-count" id="cnt-all">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('敗血症')" id="ind-btn-0">
          敗血症 <span class="chip-count" id="cnt-0">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('ARDS')" id="ind-btn-1">
          ARDS <span class="chip-count" id="cnt-1">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('心臟手術')" id="ind-btn-2">
          心臟手術 <span class="chip-count" id="cnt-2">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('ECMO／心因性休克')" id="ind-btn-3">
          ECMO <span class="chip-count" id="cnt-3">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('橫紋肌溶解')" id="ind-btn-4">
          橫紋肌溶解 <span class="chip-count" id="cnt-4">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('肝衰竭')" id="ind-btn-5">
          肝衰竭 <span class="chip-count" id="cnt-5">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('藥物移除')" id="ind-btn-6">
          藥物移除 <span class="chip-count" id="cnt-6">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('COVID-19')" id="ind-btn-7">
          COVID-19 <span class="chip-count" id="cnt-7">0</span>
        </button>
        <button class="filter-chip" onclick="setInd('整體綜述')" id="ind-btn-8">
          整體綜述 <span class="chip-count" id="cnt-8">0</span>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">CE 核准</div>
        <button class="filter-chip" onclick="toggleCE()" id="ce-btn">
          ✓ CE 核准適應症 <span class="chip-count" id="cnt-ce">0</span>
        </button>
      </div>

      <div class="sidebar-section">
        <div class="sidebar-label">研究類型</div>
        <button class="filter-chip" onclick="setType('RCT')" id="type-rct">RCT <span class="chip-count" id="cnt-rct">0</span></button>
        <button class="filter-chip" onclick="setType('Meta-analysis')" id="type-meta">Meta-analysis <span class="chip-count" id="cnt-meta">0</span></button>
        <button class="filter-chip" onclick="setType('Systematic Review')" id="type-sr">Systematic Review <span class="chip-count" id="cnt-sr">0</span></button>
        <button class="filter-chip" onclick="setType('Registry')" id="type-reg">Registry <span class="chip-count" id="cnt-reg">0</span></button>
      </div>
    </aside>

    <main class="main">
      <div class="controls">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="search" placeholder="搜尋標題、核心發現、說服論點..." oninput="render()">
        </div>
        <select class="sort-select" id="sort" onchange="render()">
          <option value="year">最新優先</option>
          <option value="stars">證據等級</option>
          <option value="ind">依適應症</option>
        </select>
      </div>
      <p class="result-info" id="result-info"></p>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>

<script>
const PASSWORD = 'cytosorb';
let allPapers = [];
let activeInd = '';
let activeType = '';
let activeCE = false;

function doLogin() {
  const pw = document.getElementById('pw-input').value;
  const err = document.getElementById('login-error');
  if (pw === PASSWORD) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadData();
  } else {
    err.style.display = 'block';
    document.getElementById('pw-input').value = '';
    document.getElementById('pw-input').focus();
    setTimeout(() => err.style.display = 'none', 3000);
  }
}

function logout() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
  document.getElementById('pw-input').value = '';
}

async function loadData() {
  document.getElementById('cards').innerHTML = '<div class="loading"><div class="spinner"></div><p class="loading-text">從 Notion 資料庫載入文獻中...</p></div>';

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 8000,
        mcp_servers: [{ type: 'url', url: 'https://mcp.notion.com/mcp', name: 'notion' }],
        messages: [{ role: 'user', content: 'Query the Notion database with ID 2c64b031-b5c8-4351-98e4-73d1b02e1d5f, get all pages with page_size 100. Return only the raw JSON tool result, nothing else.' }]
      })
    });
    const data = await res.json();

    const toolResults = data.content?.filter(b => b.type === 'mcp_tool_result') || [];
    for (const block of toolResults) {
      try {
        const parsed = JSON.parse(block.content?.[0]?.text || '{}');
        const results = parsed.results || [];
        allPapers = results.map(page => {
          const p = page.properties || {};
          return {
            id: page.id,
            title: p['文獻標題']?.title?.[0]?.plain_text || '',
            indication: p['適應症']?.select?.name || '',
            type: p['研究類型']?.select?.name || '',
            year: p['發表年份']?.number || 0,
            n: p['患者數 N']?.number || null,
            journal: p['期刊']?.rich_text?.[0]?.plain_text || '',
            finding: p['核心發現（中文）']?.rich_text?.[0]?.plain_text || '',
            salesPoint: p['說服論點']?.rich_text?.[0]?.plain_text || '',
            url: p['PubMed 連結']?.url || '',
            evidence: p['證據等級']?.select?.name || '',
            ce: p['CE核准適應症']?.checkbox || false
          };
        }).filter(p => p.title);
      } catch(e) {}
    }

    updateCounts();
    render();
  } catch(e) {
    document.getElementById('cards').innerHTML = '<div class="empty"><span class="empty-icon">⚠️</span>載入失敗，請重新整理頁面</div>';
  }
}

function starsNum(s) { return (s?.match(/⭐/g) || []).length; }

function setInd(ind) {
  activeInd = ind;
  activeType = '';
  document.querySelectorAll('[id^="ind-btn"]').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('[id^="type-"]').forEach(b => b.classList.remove('active'));
  const id = ind === '' ? 'ind-btn-all' : 'ind-btn-' + ['敗血症','ARDS','心臟手術','ECMO／心因性休克','橫紋肌溶解','肝衰竭','藥物移除','COVID-19','整體綜述'].indexOf(ind);
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
  render();
}

function setType(type) {
  activeType = activeType === type ? '' : type;
  document.querySelectorAll('[id^="type-"]').forEach(b => b.classList.remove('active'));
  if (activeType) document.getElementById('type-' + type.toLowerCase().replace('-','').replace(' ','')).classList.add('active');
  render();
}

function toggleCE() {
  activeCE = !activeCE;
  document.getElementById('ce-btn').classList.toggle('active', activeCE);
  render();
}

function updateCounts() {
  const total = allPapers.length;
  document.getElementById('total-badge').textContent = total + ' 篇文獻';
  document.getElementById('cnt-all').textContent = total;
  const inds = ['敗血症','ARDS','心臟手術','ECMO／心因性休克','橫紋肌溶解','肝衰竭','藥物移除','COVID-19','整體綜述'];
  inds.forEach((ind, i) => {
    document.getElementById('cnt-' + i).textContent = allPapers.filter(p => p.indication === ind).length;
  });
  document.getElementById('cnt-ce').textContent = allPapers.filter(p => p.ce).length;
  document.getElementById('cnt-rct').textContent = allPapers.filter(p => p.type === 'RCT').length;
  document.getElementById('cnt-meta').textContent = allPapers.filter(p => p.type === 'Meta-analysis').length;
  document.getElementById('cnt-sr').textContent = allPapers.filter(p => p.type === 'Systematic Review').length;
  document.getElementById('cnt-reg').textContent = allPapers.filter(p => p.type === 'Registry').length;
}

function render() {
  const q = document.getElementById('search').value.toLowerCase();
  const sort = document.getElementById('sort').value;

  let papers = allPapers.filter(p => {
    if (activeInd && p.indication !== activeInd) return false;
    if (activeType && p.type !== activeType) return false;
    if (activeCE && !p.ce) return false;
    if (q) {
      const txt = (p.title + p.finding + p.salesPoint + p.journal + p.indication).toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });

  papers.sort((a, b) => {
    if (sort === 'stars') return starsNum(b.evidence) - starsNum(a.evidence);
    if (sort === 'ind') return (a.indication || '').localeCompare(b.indication || '');
    return (b.year || 0) - (a.year || 0);
  });

  document.getElementById('result-info').innerHTML = `顯示 <span>${papers.length}</span> 篇 / 共 <span>${allPapers.length}</span> 篇`;

  if (!papers.length) {
    document.getElementById('cards').innerHTML = '<div class="empty"><span class="empty-icon">🔍</span>找不到符合條件的文獻</div>';
    return;
  }

  const typeClass = { 'RCT': 'badge-rct', 'Meta-analysis': 'badge-meta', 'Systematic Review': 'badge-type', 'Registry': 'badge-type', '回顧性分析': 'badge-type', 'Narrative Review': 'badge-type', 'Case Series': 'badge-type' };

  document.getElementById('cards').innerHTML = papers.map((p, i) => {
    const snippet = (p.finding || '').slice(0, 100) + (p.finding?.length > 100 ? '...' : '');
    const tc = typeClass[p.type] || 'badge-type';
    return `
    <div class="card" id="c${i}">
      <div class="card-header" onclick="toggle('c${i}')">
        <div class="card-left">
          <div class="card-badges">
            ${p.indication ? `<span class="badge badge-ind">${p.indication}</span>` : ''}
            ${p.type ? `<span class="badge ${tc}">${p.type}</span>` : ''}
            ${p.year ? `<span class="badge badge-year">${p.year}</span>` : ''}
            ${p.ce ? `<span class="badge badge-ce">✓ CE 核准</span>` : ''}
            ${p.evidence ? `<span class="stars">${p.evidence}</span>` : ''}
          </div>
          <div class="card-title">${p.title}</div>
          ${snippet ? `<div class="card-snippet">${snippet}</div>` : ''}
        </div>
        <svg class="card-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          ${p.journal ? `<div class="detail-item"><div class="detail-label">期刊</div><div class="detail-val">${p.journal}</div></div>` : ''}
          ${p.n ? `<div class="detail-item"><div class="detail-label">研究規模</div><div class="detail-val">N = ${p.n.toLocaleString()} 例</div></div>` : ''}
        </div>
        ${p.finding ? `
        <div class="section-block">
          <div class="section-title">核心發現</div>
          <div class="finding-text">${p.finding}</div>
        </div>` : ''}
        ${p.salesPoint ? `
        <div class="section-block">
          <div class="section-title">說服論點</div>
          <div class="sales-block">
            <div class="sales-label">業務應用</div>
            <div class="sales-text">${p.salesPoint}</div>
          </div>
        </div>` : ''}
        ${p.url ? `<a class="card-link" href="${p.url}" target="_blank"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>原文連結</a>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggle(id) {
  document.getElementById(id).classList.toggle('open');
}
</script>
</body>
</html>
