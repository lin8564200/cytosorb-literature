<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CytoSorb 文獻資料庫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#0F1117;--surface:#181C24;--surface2:#1E2330;--border:#2A3040;--border2:#3A4458;--text:#E8EBF0;--text2:#9BA8BB;--text3:#5A6880;--accent:#3B82F6;--accent-light:rgba(59,130,246,0.12);--green:#10B981;--green-light:rgba(16,185,129,0.12);--amber:#F59E0B;--red:#EF4444;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Serif TC",serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* LOGIN */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:3rem 2.5rem;width:100%;max-width:420px;text-align:center;}
.login-logo{width:64px;height:64px;background:linear-gradient(135deg,#1D4ED8,#3B82F6);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:30px;}
.login-title{font-family:"Instrument Serif",serif;font-size:28px;color:var(--text);margin-bottom:4px;letter-spacing:-.3px;}
.login-sub{font-size:12px;color:var(--text3);margin-bottom:2rem;font-family:"DM Mono",monospace;letter-spacing:1px;}
.login-input{width:100%;padding:13px 16px;border:1px solid var(--border);border-radius:10px;font-size:16px;font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);letter-spacing:3px;margin-bottom:12px;outline:none;transition:border-color .2s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-family:"Noto Serif TC",serif;font-weight:500;cursor:pointer;letter-spacing:.5px;transition:opacity .2s;}
.login-btn:hover{opacity:.88;}
.login-error{margin-top:10px;font-size:12px;color:var(--red);font-family:"DM Mono",monospace;display:none;}
#app{display:none;}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:30px;height:30px;background:linear-gradient(135deg,#1D4ED8,#3B82F6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;}
.topbar-title{font-family:"Instrument Serif",serif;font-size:18px;color:var(--text);}
.topbar-count{font-family:"DM Mono",monospace;font-size:11px;color:var(--text3);background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 10px;}
.logout-btn{font-size:11px;color:var(--text3);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:"DM Mono",monospace;}
.logout-btn:hover{border-color:var(--border2);color:var(--text2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 58px);}
.sidebar{width:230px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:1.25rem .875rem;position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;}
.sidebar-section{margin-bottom:1.5rem;}
.sidebar-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text3);margin-bottom:6px;padding:0 6px;}
.filter-chip{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;font-size:12px;color:var(--text2);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:"Noto Serif TC",serif;margin-bottom:1px;}
.filter-chip:hover{background:var(--surface2);color:var(--text);}
.filter-chip.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.chip-count{font-family:"DM Mono",monospace;font-size:10px;color:var(--text3);}
.filter-chip.active .chip-count{color:var(--accent);}

/* MAIN */
.main{flex:1;padding:1.5rem 2rem;min-width:0;}
.controls{display:flex;gap:10px;margin-bottom:1rem;align-items:center;}
.search-wrap{flex:1;position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text3);width:15px;height:15px;}
.search-input{width:100%;padding:10px 16px 10px 36px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:"Noto Serif TC",serif;background:var(--surface);color:var(--text);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--accent);}
.sort-select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:12px;background:var(--surface);color:var(--text2);cursor:pointer;outline:none;font-family:"DM Mono",monospace;}
.result-info{font-family:"DM Mono",monospace;font-size:11px;color:var(--text3);margin-bottom:.875rem;}
.result-info span{color:var(--text2);}

/* CARDS */
.cards{display:flex;flex-direction:column;gap:8px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s;}
.card:hover{border-color:var(--border2);}
.card-header{padding:.875rem 1.125rem;cursor:pointer;display:flex;gap:12px;align-items:flex-start;}
.card-left{flex:1;min-width:0;}
.card-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:7px;}
.badge{font-family:"DM Mono",monospace;font-size:9px;padding:2px 7px;border-radius:20px;letter-spacing:.3px;font-weight:500;}
.badge-ind{background:var(--accent-light);color:var(--accent);}
.badge-type{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.badge-ce{background:var(--green-light);color:var(--green);}
.badge-year{background:var(--surface2);color:var(--text3);border:1px solid var(--border);}
.badge-rct{background:rgba(139,92,246,.15);color:#A78BFA;}
.badge-meta{background:rgba(245,158,11,.12);color:#FCD34D;}
.stars{font-size:11px;margin-left:2px;}
.card-title{font-size:13px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:5px;}
.card-snippet{font-size:12px;color:var(--text3);line-height:1.6;}
.card-chevron{color:var(--text3);flex-shrink:0;margin-top:2px;transition:transform .2s;}
.card.open .card-chevron{transform:rotate(180deg);}

/* DETAIL */
.card-detail{border-top:1px solid var(--border);padding:1.125rem;display:none;background:var(--bg);}
.card.open .card-detail{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem;}
.detail-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text3);margin-bottom:3px;}
.detail-val{font-size:12px;color:var(--text);line-height:1.5;}

/* METRICS CHART */
.section-title{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}
.metrics-block{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem 1.125rem;margin-bottom:1rem;}
.metric-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.metric-row:last-child{margin-bottom:0;}
.metric-name{font-size:12px;color:var(--text2);width:180px;flex-shrink:0;line-height:1.3;}
.metric-bar-wrap{flex:1;background:var(--surface2);border-radius:4px;height:8px;overflow:hidden;}
.metric-bar{height:100%;border-radius:4px;transition:width .6s ease;}
.bar-down{background:linear-gradient(90deg,#3B82F6,#60A5FA);}
.bar-up{background:linear-gradient(90deg,#10B981,#34D399);}
.bar-neutral{background:linear-gradient(90deg,#6B7280,#9CA3AF);}
.metric-label{font-family:"DM Mono",monospace;font-size:10px;width:150px;flex-shrink:0;text-align:right;}
.label-down{color:#60A5FA;}
.label-up{color:#34D399;}
.label-neutral{color:var(--text3);}

/* SALES */
.sales-block{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:8px;padding:.875rem 1rem;margin-bottom:1rem;}
.sales-label{font-family:"DM Mono",monospace;font-size:9px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);margin-bottom:4px;}
.sales-text{font-size:12px;color:#6EE7B7;line-height:1.7;}

.card-link{display:inline-flex;align-items:center;gap:6px;font-family:"DM Mono",monospace;font-size:11px;color:var(--accent);text-decoration:none;padding:6px 12px;border:1px solid rgba(59,130,246,.3);border-radius:6px;transition:all .15s;}
.card-link:hover{background:var(--accent-light);}
.empty{text-align:center;padding:4rem 2rem;color:var(--text3);font-family:"DM Mono",monospace;font-size:12px;}

@media(max-width:768px){.sidebar{display:none;}.main{padding:1rem;}.topbar{padding:0 1rem;}.detail-grid{grid-template-columns:1fr;}.metric-name{width:120px;}.metric-label{width:100px;}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧬</div>
    <h1 class="login-title">CytoSorb 文獻庫</h1>
    <p class="login-sub">英禾美生醫 · 臨床文獻資料庫</p>
    <input type="password" class="login-input" id="pw-input" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入文獻庫</button>
    <p class="login-error" id="login-error">密碼錯誤，請重試</p>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🧬</div>
      <span class="topbar-title">CytoSorb 文獻資料庫</span>
      <span class="topbar-count" id="total-badge">0 篇</span>
    </div>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">適應症</div>
        <button class="filter-chip active" onclick="setInd('')" id="ind-all">全部 <span class="chip-count" id="cnt-all">0</span></button>
        <button class="filter-chip" onclick="setInd('敗血症')" id="ind-0">敗血症 <span class="chip-count" id="cnt-0">0</span></button>
        <button class="filter-chip" onclick="setInd('ARDS')" id="ind-1">ARDS <span class="chip-count" id="cnt-1">0</span></button>
        <button class="filter-chip" onclick="setInd('心臟手術')" id="ind-2">心臟手術 <span class="chip-count" id="cnt-2">0</span></button>
        <button class="filter-chip" onclick="setInd('ECMO／心因性休克')" id="ind-3">ECMO <span class="chip-count" id="cnt-3">0</span></button>
        <button class="filter-chip" onclick="setInd('橫紋肌溶解')" id="ind-4">橫紋肌溶解 <span class="chip-count" id="cnt-4">0</span></button>
        <button class="filter-chip" onclick="setInd('肝衰竭')" id="ind-5">肝衰竭 <span class="chip-count" id="cnt-5">0</span></button>
        <button class="filter-chip" onclick="setInd('藥物移除')" id="ind-6">藥物移除 <span class="chip-count" id="cnt-6">0</span></button>
        <button class="filter-chip" onclick="setInd('COVID-19')" id="ind-7">COVID-19 <span class="chip-count" id="cnt-7">0</span></button>
        <button class="filter-chip" onclick="setInd('整體綜述')" id="ind-8">整體綜述 <span class="chip-count" id="cnt-8">0</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">CE 核准</div>
        <button class="filter-chip" onclick="toggleCE()" id="ce-btn">✓ CE 核准 <span class="chip-count" id="cnt-ce">0</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">研究類型</div>
        <button class="filter-chip" onclick="setType('RCT')" id="type-rct">RCT <span class="chip-count" id="cnt-rct">0</span></button>
        <button class="filter-chip" onclick="setType('Meta-analysis')" id="type-meta">Meta-analysis <span class="chip-count" id="cnt-meta">0</span></button>
        <button class="filter-chip" onclick="setType('Systematic Review')" id="type-sr">Systematic Review <span class="chip-count" id="cnt-sr">0</span></button>
        <button class="filter-chip" onclick="setType('Registry')" id="type-reg">Registry <span class="chip-count" id="cnt-reg">0</span></button>
      </div>
    </aside>
    <main class="main">
      <div class="controls">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="search" placeholder="搜尋標題、核心發現、說服論點..." oninput="render()">
        </div>
        <select class="sort-select" id="sort" onchange="render()">
          <option value="year">最新優先</option>
          <option value="stars">證據等級</option>
          <option value="ind">依適應症</option>
        </select>
      </div>
      <p class="result-info" id="result-info"></p>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>

<script>
const PAPERS = [
  {
    "title": "Berlot G. et al. — Real-World Outcomes of Hemoadsorption with CytoSorb® in Patients with Septic Shock",
    "ind": "敗血症",
    "type": "回顧性分析",
    "year": 2025,
    "n": 175,
    "journal": "Journal of Intensive Care Medicine",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/40170437/",
    "finding": "回顧 175 例敗血性休克，58% 在 24 小時內啟動 CytoSorb（早期組），42% 在 25–48 小時內啟動（晚期組）。存活者全部出現一致的改善軌跡，早期組存活率顯著優於晚期組。",
    "sales": "175 例真實世界數據顯示存活者全部出現升壓藥需求下降和乳酸改善。24 小時內介入明顯優於 48 小時——現在就是最好時機。",
    "metrics": [
      {
        "name": "升壓藥（NE）需求",
        "dir": "down",
        "level": 95,
        "label": "顯著↓"
      },
      {
        "name": "乳酸（Lactate）",
        "dir": "down",
        "level": 85,
        "label": "顯著↓"
      },
      {
        "name": "CRP 炎症指標",
        "dir": "down",
        "level": 80,
        "label": "顯著↓"
      },
      {
        "name": "PCT",
        "dir": "down",
        "level": 78,
        "label": "顯著↓"
      },
      {
        "name": "SOFA 分數",
        "dir": "down",
        "level": 72,
        "label": "顯著↓"
      },
      {
        "name": "MAP 平均動脈壓",
        "dir": "up",
        "level": 70,
        "label": "顯著↑"
      }
    ]
  },
  {
    "title": "Hemoadsorption in the Management of Septic Shock: A Systematic Review and Meta-Analysis (2025, N=744)",
    "ind": "敗血症",
    "type": "Systematic Review",
    "year": 2025,
    "n": 744,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11989519/",
    "finding": "744 例敗血性休克 Meta-analysis。院內死亡率 OR=0.64（p=0.036），28–30 天死亡率 OR=0.49（p=0.003），兩項均達統計顯著。",
    "sales": "28 天死亡率 OR=0.49（p=0.003），使用 CytoSorb 存活機率幾乎是對照組的 2 倍。",
    "metrics": [
      {
        "name": "28–30 天死亡率",
        "dir": "down",
        "level": 98,
        "label": "OR=0.49 p=0.003"
      },
      {
        "name": "院內死亡率",
        "dir": "down",
        "level": 90,
        "label": "OR=0.64 p=0.036"
      },
      {
        "name": "血流動力學",
        "dir": "up",
        "level": 80,
        "label": "顯著改善"
      }
    ]
  },
  {
    "title": "Hawchar F. et al. — Final Results of the International CytoSorb Registry (N=1434)",
    "ind": "敗血症",
    "type": "Registry",
    "year": 2022,
    "n": 1434,
    "journal": "PLoS ONE",
    "evidence": "⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/36282800/",
    "finding": "1434 例真實世界登錄。APACHE II 預測死亡率 62%，實際 ICU 死亡率 50.1%，低 12 個百分點。",
    "sales": "預測死亡率 62% 但實際 50.1%，低了 12 個百分點——這是目前最大的真實世界數據。",
    "metrics": [
      {
        "name": "預測死亡率（APACHE II）",
        "dir": "none",
        "level": 62,
        "label": "62%"
      },
      {
        "name": "實際 ICU 死亡率",
        "dir": "down",
        "level": 50,
        "label": "50.1% ↓12%"
      },
      {
        "name": "PCT",
        "dir": "down",
        "level": 75,
        "label": "顯著↓"
      },
      {
        "name": "CRP",
        "dir": "down",
        "level": 70,
        "label": "顯著↓"
      }
    ]
  },
  {
    "title": "Kogelmann K. et al. — First Evaluation of CytoScore Dynamic Scoring System in Septic Shock (N=502)",
    "ind": "敗血症",
    "type": "回顧性分析",
    "year": 2021,
    "n": 502,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/34209001/",
    "finding": "502 例敗血性休克，建立 CytoScore 動態評分系統。DSS > 6 分為難治性休克，> 8 分死亡率最高。早期啟動 CytoSorb（診斷後 24 小時內）與 56 天存活率顯著改善相關（p<0.05）。",
    "sales": "CytoScore 的原始創建文獻。DSS > 6 分且 24 小時內介入，與 56 天存活率顯著改善相關。",
    "metrics": [
      {
        "name": "56 天存活率（早期介入）",
        "dir": "up",
        "level": 85,
        "label": "p<0.05"
      },
      {
        "name": "升壓藥需求",
        "dir": "down",
        "level": 80,
        "label": "顯著↓"
      },
      {
        "name": "死亡率（DSS>8）",
        "dir": "none",
        "level": 90,
        "label": "最高風險組"
      }
    ]
  },
  {
    "title": "Hawchar F. et al. — Proof of Concept RCT: Extracorporeal Cytokine Adsorption in Septic Shock (N=20)",
    "ind": "敗血症",
    "type": "RCT",
    "year": 2019,
    "n": 20,
    "journal": "Journal of Critical Care",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/30638101/",
    "finding": "20 例敗血性休克 RCT（CytoSorb 組 N=10，對照組 N=10）。CytoSorb 組 norepinephrine 需求顯著下降（T0=0.54 vs T48=0.16 μg/kg/min，p=0.016）；PCT 濃度顯著下降。",
    "sales": "即使在小型 RCT 裡，升壓藥需求就已經達到統計顯著改善（p=0.016）。這不是趨勢，是顯著。",
    "metrics": [
      {
        "name": "NE 劑量（T0 → T48）",
        "dir": "down",
        "level": 92,
        "label": "0.54→0.16 p=0.016"
      },
      {
        "name": "PCT",
        "dir": "down",
        "level": 78,
        "label": "顯著↓"
      },
      {
        "name": "SOFA 分數",
        "dir": "down",
        "level": 60,
        "label": "趨勢↓"
      }
    ]
  },
  {
    "title": "Akil A. et al. — CytoSorb in Severe ARDS with VV-ECMO: Systematic Review with Statistical Significance",
    "ind": "ARDS",
    "type": "Systematic Review",
    "year": 2022,
    "n": null,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,

const PASSWORD = "cytosorb";
let activeInd = "", activeType = "", activeCE = false;

function doLogin() {
  const pw = document.getElementById("pw-input").value;
  if (pw === PASSWORD) {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("app").style.display = "block";
    updateCounts(); render();
  } else {
    const err = document.getElementById("login-error");
    err.style.display = "block";
    document.getElementById("pw-input").value = "";
    document.getElementById("pw-input").focus();
    setTimeout(() => err.style.display = "none", 3000);
  }
}
function logout() {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
  document.getElementById("pw-input").value = "";
}
function starsNum(s) { return (s?.match(/⭐/g) || []).length; }
function setInd(ind) {
  activeInd = ind; activeType = "";
  document.querySelectorAll("[id^='ind-'],[id^='type-']").forEach(b => b.classList.remove("active"));
  const ids = ["敗血症","ARDS","心臟手術","ECMO／心因性休克","橫紋肌溶解","肝衰竭","藥物移除","COVID-19","整體綜述"];
  const el = document.getElementById(ind === "" ? "ind-all" : "ind-" + ids.indexOf(ind));
  if (el) el.classList.add("active");
  render();
}
function setType(type) {
  activeType = activeType === type ? "" : type;
  document.querySelectorAll("[id^='type-']").forEach(b => b.classList.remove("active"));
  const m = {"RCT":"rct","Meta-analysis":"meta","Systematic Review":"sr","Registry":"reg"};
  if (activeType && m[activeType]) document.getElementById("type-" + m[activeType])?.classList.add("active");
  render();
}
function toggleCE() {
  activeCE = !activeCE;
  document.getElementById("ce-btn").classList.toggle("active", activeCE);
  render();
}
function updateCounts() {
  document.getElementById("total-badge").textContent = PAPERS.length + " 篇";
  document.getElementById("cnt-all").textContent = PAPERS.length;
  ["敗血症","ARDS","心臟手術","ECMO／心因性休克","橫紋肌溶解","肝衰竭","藥物移除","COVID-19","整體綜述"].forEach((ind,i) => {
    const el = document.getElementById("cnt-" + i);
    if (el) el.textContent = PAPERS.filter(p => p.ind === ind).length;
  });
  document.getElementById("cnt-ce").textContent = PAPERS.filter(p => p.ce).length;
  ["RCT","Meta-analysis","Systematic Review","Registry"].forEach((type,i) => {
    const keys = ["rct","meta","sr","reg"];
    const el = document.getElementById("cnt-" + keys[i]);
    if (el) el.textContent = PAPERS.filter(p => p.type === type).length;
  });
}
function renderMetrics(metrics) {
  if (!metrics || !metrics.length) return "";
  return `<div class="section-title">臨床指標變化</div>
  <div class="metrics-block">
    ${metrics.map(m => {
      const bc = m.dir === "down" ? "bar-down" : m.dir === "up" ? "bar-up" : "bar-neutral";
      const lc = m.dir === "down" ? "label-down" : m.dir === "up" ? "label-up" : "label-neutral";
      const arr = m.dir === "down" ? " ↓" : m.dir === "up" ? " ↑" : "";
      return `<div class="metric-row">
        <div class="metric-name">${m.name}${arr}</div>
        <div class="metric-bar-wrap"><div class="metric-bar ${bc}" style="width:${m.level}%"></div></div>
        <div class="metric-label ${lc}">${m.label}</div>
      </div>`;
    }).join("")}
  </div>`;
}
function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const sort = document.getElementById("sort").value;
  let papers = PAPERS.filter(p => {
    if (activeInd && p.ind !== activeInd) return false;
    if (activeType && p.type !== activeType) return false;
    if (activeCE && !p.ce) return false;
    if (q) {
      const txt = (p.title + p.finding + p.sales + p.journal + p.ind).toLowerCase();
      if (!txt.includes(q)) return false;
    }
    return true;
  });
  papers.sort((a,b) => {
    if (sort === "stars") return starsNum(b.evidence) - starsNum(a.evidence);
    if (sort === "ind") return (a.ind||"").localeCompare(b.ind||"");
    return (b.year||0) - (a.year||0);
  });
  document.getElementById("result-info").innerHTML = `顯示 <span>${papers.length}</span> 篇 / 共 <span>${PAPERS.length}</span> 篇`;
  if (!papers.length) {
    document.getElementById("cards").innerHTML = '<div class="empty">找不到符合條件的文獻</div>';
    return;
  }
  const tc = {"RCT":"badge-rct","Meta-analysis":"badge-meta"};
  document.getElementById("cards").innerHTML = papers.map((p,i) => {
    const snippet = (p.finding||"").slice(0,100) + ((p.finding||"").length > 100 ? "..." : "");
    const bc = tc[p.type] || "badge-type";
    return `<div class="card" id="c${i}">
      <div class="card-header" onclick="toggle('c${i}')">
        <div class="card-left">
          <div class="card-badges">
            ${p.ind ? `<span class="badge badge-ind">${p.ind}</span>` : ""}
            ${p.type ? `<span class="badge ${bc}">${p.type}</span>` : ""}
            ${p.year ? `<span class="badge badge-year">${p.year}</span>` : ""}
            ${p.ce ? '<span class="badge badge-ce">✓ CE 核准</span>' : ""}
            ${p.evidence ? `<span class="stars">${p.evidence}</span>` : ""}
          </div>
          <div class="card-title">${p.title}</div>
          ${snippet ? `<div class="card-snippet">${snippet}</div>` : ""}
        </div>
        <svg class="card-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          ${p.journal ? `<div><div class="detail-label">期刊</div><div class="detail-val">${p.journal}</div></div>` : ""}
          ${p.n ? `<div><div class="detail-label">研究規模</div><div class="detail-val">N = ${p.n.toLocaleString()} 例</div></div>` : ""}
        </div>
        ${p.metrics && p.metrics.length ? renderMetrics(p.metrics) : ""}
        ${p.finding ? `<div class="section-title">核心發現</div><div style="font-size:13px;color:var(--text2);line-height:1.8;margin-bottom:1rem;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;">${p.finding}</div>` : ""}
        ${p.sales ? `<div class="sales-block"><div class="sales-label">說服論點</div><div class="sales-text">${p.sales}</div></div>` : ""}
        ${p.url ? `<a class="card-link" href="${p.url}" target="_blank"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>原文連結</a>` : ""}
      </div>
    </div>`;
  }).join("");
}
function toggle(id) { document.getElementById(id).classList.toggle("open"); }
