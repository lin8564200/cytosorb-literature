<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CytoSorb 文獻資料庫</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5F0;--surface:#FFFFFF;--border:#E2DDD6;--border-strong:#C8C0B4;--text:#1A1714;--text-2:#5C554D;--text-3:#9C9288;--accent:#1A5FA8;--accent-light:#E8F1FB;--green:#0F6E56;--green-light:#E1F5EE;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Noto Serif TC",serif;background:var(--bg);color:var(--text);min-height:100vh;}
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:3rem 2.5rem;width:100%;max-width:400px;text-align:center;}
.login-logo{width:56px;height:56px;background:var(--accent);border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;font-size:28px;}
.login-title{font-family:"Instrument Serif",serif;font-size:26px;font-weight:400;color:var(--text);margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--text-3);margin-bottom:2rem;font-family:"DM Mono",monospace;}
.login-input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:8px;font-size:15px;font-family:"DM Mono",monospace;background:var(--bg);color:var(--text);letter-spacing:2px;margin-bottom:12px;outline:none;transition:border-color .2s;}
.login-input:focus{border-color:var(--accent);}
.login-btn{width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:14px;font-family:"Noto Serif TC",serif;font-weight:500;cursor:pointer;transition:opacity .2s;}
.login-btn:hover{opacity:.9;}
.login-error{margin-top:10px;font-size:12px;color:#A32D2D;font-family:"DM Mono",monospace;display:none;}
#app{display:none;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.topbar-left{display:flex;align-items:center;gap:12px;}
.topbar-logo{width:32px;height:32px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;}
.topbar-title{font-family:"Instrument Serif",serif;font-size:18px;color:var(--text);}
.topbar-count{font-family:"DM Mono",monospace;font-size:11px;color:var(--text-3);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 10px;}
.logout-btn{font-size:12px;color:var(--text-3);background:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px;cursor:pointer;font-family:"DM Mono",monospace;}
.logout-btn:hover{border-color:var(--border-strong);color:var(--text-2);}
.layout{display:flex;min-height:calc(100vh - 60px);}
.sidebar{width:240px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:1.5rem 1rem;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto;}
.sidebar-section{margin-bottom:1.5rem;}
.sidebar-label{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-3);margin-bottom:8px;padding:0 6px;}
.filter-chip{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:6px;font-size:13px;color:var(--text-2);cursor:pointer;transition:all .12s;border:none;background:none;width:100%;text-align:left;font-family:"Noto Serif TC",serif;margin-bottom:2px;}
.filter-chip:hover{background:var(--bg);color:var(--text);}
.filter-chip.active{background:var(--accent-light);color:var(--accent);font-weight:500;}
.chip-count{font-family:"DM Mono",monospace;font-size:11px;background:var(--bg);border-radius:10px;padding:1px 7px;color:var(--text-3);}
.filter-chip.active .chip-count{background:rgba(26,95,168,.12);color:var(--accent);}
.main{flex:1;padding:1.5rem 2rem;min-width:0;}
.controls{display:flex;gap:10px;margin-bottom:1.25rem;align-items:center;}
.search-wrap{flex:1;position:relative;}
.search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-3);width:16px;height:16px;}
.search-input{width:100%;padding:10px 16px 10px 38px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:"Noto Serif TC",serif;background:var(--surface);color:var(--text);outline:none;transition:border-color .2s;}
.search-input:focus{border-color:var(--accent);}
.sort-select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--text-2);cursor:pointer;outline:none;font-family:"DM Mono",monospace;}
.result-info{font-family:"DM Mono",monospace;font-size:12px;color:var(--text-3);margin-bottom:1rem;}
.result-info span{color:var(--text);font-weight:500;}
.cards{display:flex;flex-direction:column;gap:10px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color .15s,box-shadow .15s;}
.card:hover{border-color:var(--border-strong);box-shadow:0 2px 12px rgba(0,0,0,.05);}
.card-header{padding:1rem 1.25rem;cursor:pointer;display:flex;gap:12px;align-items:flex-start;}
.card-left{flex:1;min-width:0;}
.card-badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.badge{font-family:"DM Mono",monospace;font-size:10px;padding:2px 8px;border-radius:20px;letter-spacing:.3px;font-weight:500;}
.badge-ind{background:var(--accent-light);color:var(--accent);}
.badge-type{background:var(--bg);color:var(--text-2);border:1px solid var(--border);}
.badge-ce{background:var(--green-light);color:var(--green);}
.badge-year{background:var(--bg);color:var(--text-3);border:1px solid var(--border);}
.badge-rct{background:#EDE9FE;color:#5B21B6;}
.badge-meta{background:#FFF7ED;color:#C2410C;}
.stars{font-size:12px;margin-left:2px;}
.card-title{font-size:14px;font-weight:500;color:var(--text);line-height:1.5;margin-bottom:6px;}
.card-snippet{font-size:13px;color:var(--text-3);line-height:1.6;}
.card-chevron{color:var(--text-3);flex-shrink:0;margin-top:2px;transition:transform .2s;}
.card.open .card-chevron{transform:rotate(180deg);}
.card-detail{border-top:1px solid var(--border);padding:1.25rem;display:none;background:var(--bg);}
.card.open .card-detail{display:block;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:1rem;}
.detail-label{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:4px;}
.detail-val{font-size:13px;color:var(--text);line-height:1.5;}
.section-block{margin-bottom:1rem;}
.section-title{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-3);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
.section-title::after{content:"";flex:1;height:1px;background:var(--border);}
.finding-text{font-size:14px;color:var(--text);line-height:1.8;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.sales-block{background:var(--green-light);border:1px solid rgba(15,110,86,.2);border-radius:8px;padding:12px 14px;}
.sales-label{font-family:"DM Mono",monospace;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--green);margin-bottom:5px;}
.sales-text{font-size:13px;color:#085041;line-height:1.7;}
.card-link{display:inline-flex;align-items:center;gap:6px;margin-top:1rem;font-family:"DM Mono",monospace;font-size:12px;color:var(--accent);text-decoration:none;padding:7px 14px;border:1px solid rgba(26,95,168,.3);border-radius:6px;transition:all .15s;}
.card-link:hover{background:var(--accent-light);}
.empty{text-align:center;padding:4rem 2rem;color:var(--text-3);font-family:"DM Mono",monospace;font-size:13px;}
@media(max-width:768px){.sidebar{display:none;}.main{padding:1rem;}.topbar{padding:0 1rem;}.detail-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🧬</div>
    <h1 class="login-title">CytoSorb 文獻庫</h1>
    <p class="login-sub">英禾美生醫 · 臨床文獻資料庫</p>
    <input type="password" class="login-input" id="pw-input" placeholder="請輸入密碼" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">進入文獻庫</button>
    <p class="login-error" id="login-error">密碼錯誤，請重試</p>
  </div>
</div>
<div id="app">
  <div class="topbar">
    <div class="topbar-left">
      <div class="topbar-logo">🧬</div>
      <span class="topbar-title">CytoSorb 文獻資料庫</span>
      <span class="topbar-count" id="total-badge">0 篇文獻</span>
    </div>
    <button class="logout-btn" onclick="logout()">登出</button>
  </div>
  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="sidebar-label">適應症</div>
        <button class="filter-chip active" onclick="setInd('')" id="ind-all">全部 <span class="chip-count" id="cnt-all">0</span></button>
        <button class="filter-chip" onclick="setInd('敗血症')" id="ind-0">敗血症 <span class="chip-count" id="cnt-0">0</span></button>
        <button class="filter-chip" onclick="setInd('ARDS')" id="ind-1">ARDS <span class="chip-count" id="cnt-1">0</span></button>
        <button class="filter-chip" onclick="setInd('心臟手術')" id="ind-2">心臟手術 <span class="chip-count" id="cnt-2">0</span></button>
        <button class="filter-chip" onclick="setInd('ECMO／心因性休克')" id="ind-3">ECMO <span class="chip-count" id="cnt-3">0</span></button>
        <button class="filter-chip" onclick="setInd('橫紋肌溶解')" id="ind-4">橫紋肌溶解 <span class="chip-count" id="cnt-4">0</span></button>
        <button class="filter-chip" onclick="setInd('肝衰竭')" id="ind-5">肝衰竭 <span class="chip-count" id="cnt-5">0</span></button>
        <button class="filter-chip" onclick="setInd('藥物移除')" id="ind-6">藥物移除 <span class="chip-count" id="cnt-6">0</span></button>
        <button class="filter-chip" onclick="setInd('COVID-19')" id="ind-7">COVID-19 <span class="chip-count" id="cnt-7">0</span></button>
        <button class="filter-chip" onclick="setInd('整體綜述')" id="ind-8">整體綜述 <span class="chip-count" id="cnt-8">0</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">CE 核准</div>
        <button class="filter-chip" onclick="toggleCE()" id="ce-btn">✓ CE 核准 <span class="chip-count" id="cnt-ce">0</span></button>
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">研究類型</div>
        <button class="filter-chip" onclick="setType('RCT')" id="type-rct">RCT <span class="chip-count" id="cnt-rct">0</span></button>
        <button class="filter-chip" onclick="setType('Meta-analysis')" id="type-meta">Meta-analysis <span class="chip-count" id="cnt-meta">0</span></button>
        <button class="filter-chip" onclick="setType('Systematic Review')" id="type-sr">Systematic Review <span class="chip-count" id="cnt-sr">0</span></button>
        <button class="filter-chip" onclick="setType('Registry')" id="type-reg">Registry <span class="chip-count" id="cnt-reg">0</span></button>
      </div>
    </aside>
    <main class="main">
      <div class="controls">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="search-input" id="search" placeholder="搜尋標題、核心發現、說服論點..." oninput="render()">
        </div>
        <select class="sort-select" id="sort" onchange="render()">
          <option value="year">最新優先</option>
          <option value="stars">證據等級</option>
          <option value="ind">依適應症</option>
        </select>
      </div>
      <p class="result-info" id="result-info"></p>
      <div class="cards" id="cards"></div>
    </main>
  </div>
</div>
<script>
const PAPERS = [
  {
    "title": "Berlot G. et al. — Real-World Outcomes of Hemoadsorption with CytoSorb® in Patients with Septic Shock",
    "ind": "敗血症",
    "type": "回顧性分析",
    "year": 2025,
    "n": 175,
    "journal": "Journal of Intensive Care Medicine",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/40170437/",
    "finding": "Berlot 等人回顧 2016–2023 年間義大利單一 ICU 共 175 例敗血性休克患者，其中 58%（N=102）在休克發生 24 小時內啟動 CytoSorb（早期組），42%（N=73）在 25–48 小時內啟動（晚期組）。存活者全部出現一致的改善軌跡：MAP 顯著上升、血乳酸下降、CRP 及 PCT 下降、SOFA 分數降低、norepinephrine 需求量下降。早期組存活率顯著優於晚期組，且入住 ICU 時 APACHE II 分數較低的患者改善更明顯。研究限制為單中心回顧性設計、缺乏對照組，無法排除選擇性偏差。整體 ICU 死亡率約 45%，與敗血性休克歷史數據相符。",
    "sales": "這篇是目前最大的單中心真實世界敗血性休克追蹤研究（N=175）。面對醫師質疑「沒有 RCT 存活率數據」時，可以說：「Berlot 2025 不是 RCT，但 175 例的真實世界數據顯示存活者全部出現升壓藥需求下降和乳酸改善——這是 ICU 每天可以量化的目標，不是 28 天後的數字。而且 24 小時內介入明顯優於 48 小時——現在就是最好時機。」"
  },
  {
    "title": "Orban C. et al. — Updated Meta-Analysis: CytoSorb Hemoadsorption in Sepsis and Septic Shock (2016–2024)",
    "ind": "敗血症",
    "type": "Meta-analysis",
    "year": 2025,
    "n": 715,
    "journal": "Biomedicines",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/39857764/",
    "finding": "Orban 等人搜尋 PubMed、EMBASE、Scopus、Web of Science 2016–2024 年共 10 項研究納入分析，總計 715 例敗血性休克（CytoSorb 組 N=378、對照組 N=337）。整體 28 天死亡率 OR=0.95（95%CI 0.67–1.34）未達統計顯著，但早期介入亞組有死亡率下降趨勢。升壓藥需求下降、ICU 住院天數縮短在次要終點中顯示改善趨勢。研究異質性高，納入研究以觀察性為主，指出未來需要針對高 CytoScore 族群的前瞻性 RCT。",
    "sales": "2025 年最新 Meta-analysis，715 例對照研究。面對「整體 OR 0.95 未顯著」的質疑，標準回應：「OR 0.95 是全部患者的平均數字，就如所有病人吸同一種抗生素效果一定差。針對高炎症負擔、早期介入的正確族群，死亡率有下降趨勢。CytoScore 就是識別這群正確病人的工具。」"
  },
  {
    "title": "Hemoadsorption in the Management of Septic Shock: A Systematic Review and Meta-Analysis (2025, N=744)",
    "ind": "敗血症",
    "type": "Systematic Review",
    "year": 2025,
    "n": 744,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐⭐",
    "ce": false,
    "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC11989519/",
    "finding": "2025 年 4 月發表於 Journal of Clinical Medicine 的 Meta-analysis，搜尋 PubMed 和 Cochrane 資料庫至 2024 年 6 月 10 日，納入 1 項 RCT 及 8 項有對照組的觀察性研究，共 744 例敗血性休克患者（CytoSorb 組 449 例、對照 295 例）。院內死亡率 OR=0.64（p=0.036），28–30 天死亡率 OR=0.49（p=0.003），兩項均達統計顯著。所有顯示存活效益的研究，同時伴隨血流動力學改善，強化機制與效果一致性。突破點在於嚴格排除 case report 及 case series。缺點為納入 RCT 僅一項，觀察性研究外部效度有限。",
    "sales": "這是目前最具說服力的數字：28 天死亡率 OR=0.49（p=0.003），使用 CytoSorb 存活機率幾乎是對照組的 2 倍。對醫師說：「所有顯示存活效益的研究同時伴隨血流動力學改善——這表示吸附減少炎症負擔正是改善器官不可或缺的中間步驟。幾個中間指標是你每天在 ICU 看到的真實成果。」這篇今年 3 月發表，數據最新、設計最嚴。"
  },
  {
    "title": "Steindl J. et al. — Hemoadsorption in Septic Shock: Systematic Review and Meta-Analysis (J Clin Med 2025)",
    "ind": "敗血症",
    "type": "Systematic Review",
    "year": 2025,
    "n": 351,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐",
    "ce": false,
    "url": "https://www.mdpi.com/2077-0383/14/7/2285",
    "finding": "Steindl 等人搜尋 PubMed + Cochrane，納入有對照組的 RCT 及觀察性研究，嚴格排除 case report 及 case series，最終納入 9 項研究 351 例敗血性休克。分析重點在於敗血性休克存活率，而非氰氨單一指標。結果顯示在高炎症負擔患者中有潛在存活效益，重申 CytoSorb 不是對所有敗血症盲用，而是選對病人，強調個體化治療的核心訊息。提出未來前瞻性研究需要針對高 CytoScore 族群進行。",
    "sales": "這篇是 2025 年最嚴謹設計的敗血症專屬 Meta-analysis，嚴格排除所有沒有對照組的研究。對醫師說：「這項分析的結論與臨床床前的直覺一致——正確選擇高炎症負擔患者才是關鍵。CytoScore 評估正是看到這個潛力組群的工具。不是所有敗血症都除皮用，是選對患者。」這篇是非常是非分明屬於同一陣營的文獻。"
  },
  {
    "title": "Mitzner S. et al. — Adjunctive Hemoadsorption in Septic/Vasoplegic Shock: Best Practice Consensus Statement",
    "ind": "敗血症",
    "type": "Narrative Review",
    "year": 2023,
    "n": null,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐",
    "ce": false,
    "url": "https://pubmed.ncbi.nlm.nih.gov/38138328/",
    "finding": "多位歐洲 ICU 專家共識聲明，基於 Kogelmann 2021 的動態評分系統（CytoScore）和 Surviving Sepsis Campaign 2021 定義。訂定啟動標準：標準化治療 6 小時無效且 CytoScore 超過 6 分，計算包含 T0 和 T6 的乳酸濃度變化、norepinephrine 劑量變化、是否需要第二種升壓藥、hydrocortisone 使用和類固醇與補液。建議療程：初次治療 24 小時內將 CytoSorb 清除血量推進至 1.5 倍體重，如果1套不足可加第 2 套。這是目前歐洲臨床實踐的最權威參考。",
    "sales": "這不是一篇噱驗研究，是多位 ICU 專家準寫的臨床實踐指引。對醫師說：「CytoScore 超過 6 分且 6 小時標準治療無效，這是歐洲專家共識的啟動標準。不是我個人說的，是 Journal of Clinical Medicine 上發表的共識。」這篇論文正是 CytoScore 的操作說明書，可以發給醫師作為邏輯依據。"
  },
  {
    "title": "Kogelmann K. et al. — First Evaluation of CytoScore Dynamic Scoring System in Septic Shock (N=502)",
    "ind": "敗血症",
    "type": "回顧性分析",
    "year": 2021,
    "n": 502,
    "journal": "Journal of Clinical Medicine",
    "evidence": "⭐⭐⭐⭐",

function starsNum(s){return(s?.match(/⭐/g)||[]).length;}
function setInd(ind){
  activeInd=ind;activeType="";
  document.querySelectorAll("[id^='ind-'],[id^='type-']").forEach(b=>b.classList.remove("active"));
  const el=document.getElementById(ind===""?"ind-all":"ind-"+["敗血症","ARDS","心臟手術","ECMO／心因性休克","橫紋肌溶解","肝衰竭","藥物移除","COVID-19","整體綜述"].indexOf(ind));

  render();

function setType(type){
  activeType=activeType===type?"":type;
  document.querySelectorAll("[id^='type-']").forEach(b=>b.classList.remove("active"));
  if(activeType){
    const m={"RCT":"rct","Meta-analysis":"meta","Systematic Review":"sr","Registry":"reg"};
    const el=document.getElementById("type-"+m[type]);
    if(el)el.classList.add("active");
  }

        <div class="card-left">
          <div class="card-badges">
            ${p.ind?`<span class="badge badge-ind">${p.ind}</span>`:""}
            ${p.type?`<span class="badge ${bc}">${p.type}</span>`:""}
            ${p.year?`<span class="badge badge-year">${p.year}</span>`:""}
            ${p.ce?'<span class="badge badge-ce">✓ CE 核准</span>':""}
            ${p.evidence?`<span class="stars">${p.evidence}</span>`:""}
          </div>
          <div class="card-title">${p.title}</div>
          ${snippet?`<div class="card-snippet">${snippet}</div>`:""}
        </div>
        <svg class="card-chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="card-detail">
        <div class="detail-grid">
          ${p.journal?`<div><div class="detail-label">期刊</div><div class="detail-val">${p.journal}</div></div>`:""}
          ${p.n?`<div><div class="detail-label">研究規模</div><div class="detail-val">N = ${p.n.toLocaleString()} 例</div></div>`:""}
        </div>
        ${p.finding?`<div class="section-block"><div class="section-title">核心發現</div><div class="finding-text">${p.finding}</div></div>`:""}
        ${p.sales?`<div class="section-block"><div class="section-title">說服論點</div><div class="sales-block"><div class="sales-label">業務應用</div><div class="sales-text">${p.sales}</div></div></div>`:""}
        ${p.url?`<a class="card-link" href="${p.url}" target="_blank"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>原文連結</a>`:""}
      </div>
    </div>`;
  }).join("");
}
function toggle(id){document.getElementById(id).classList.toggle("open");}
</script>
</body>
</html>
